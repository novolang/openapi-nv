[package]
name        = "openapi-nv"
version     = "0.0.2"
description = "OpenAPI 3.1 as a typed document value that renders to and parses from the standard library's JSON, a paths object DERIVED from a router-nv route table rather than typed twice, request and response validation against schema-nv's compiled schemas as pure arithmetic that cannot fail, and a document diff that says which changes are breaking.  Interface only — every body is a todo()."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`.  A document is a value, rendering it is a walk to a JSON
# value, and validating a request against it is arithmetic over values
# the caller already holds.
#
# The one place a document reaches outside itself is a `$ref` to
# another document, and resolving one means READING — which this
# package cannot do and does not do.  `oapidoc.external_refs` names the
# URIs; the host fetches them and hands them back.  That is schema-nv's
# own shape, and it is what makes an OpenAPI document from outside
# unable to make a program fetch a URL.
#
# No `@tier(embedded)` claim, and none is intended: a document is a tree
# of growable lists and the JSON value it renders to is a host handle
# (`json.*` is not admitted at `@tier(embedded)`).  Nothing on a device
# reads an API description.
layer       = "core"

category    = "web"

tags        = ["openapi", "swagger", "api", "schema", "validation", "json-schema", "documentation", "sans-io"]
repository  = "https://github.com/novolang/openapi-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A description derived from the route table, not typed beside it"

[dependencies]
# schema-nv, FOR EVERY SCHEMA IN THE DOCUMENT.
#
# OpenAPI 3.1 aligned its schema object with JSON Schema 2020-12
# exactly — that alignment is the version's headline change — so a
# schema here IS a JSON Schema and validating against one is
# `schvalidate.validate`.  Re-implementing that would be a second
# validator disagreeing with the first about the same documents.
#
# `core`, so `dep-layer` holds.  Its `external_refs` shape is also the
# one this package copies for its own `$ref`s, which is why the two
# compose rather than each having their own opinion about fetching.
schema-nv = "^0.0.1"

# router-nv, FOR THE PATHS OBJECT.
#
# A PATH DEPENDENCY ON A SIBLING IN THIS LANE, and the coordinator
# converts it to `^0.0.1` at publish — a path dependency is refused by
# `novo pkg publish`, which is the rule that keeps a published tarball
# from sending every consumer to a directory on somebody else's
# machine.  Publish router-nv first: a package cannot be published
# ahead of what it depends on.
#
# Why the dependency exists at all: a route table and a paths object
# are the same facts written twice, and the copy that is not executed
# is the one that goes stale.  `oapiroute.from_routes` derives the
# second from the first, and `oapiroute.drift` answers the question a
# CI job asks — does this document still describe this service?
#
# `core`, so `dep-layer` holds.
router-nv = "^0.0.1"
